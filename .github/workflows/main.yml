name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # ← важно: на одном уровне с push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:  # ← отступ 8 пробелов
          node-version: 20
      - run: npm ci  # ← лучше npm ci для CI/CD
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:  # ← отступ 8 пробелов
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4  # ← отступ 8 пробелов
